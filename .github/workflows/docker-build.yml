name: Build Android OS Builder Image

on:
  push:
    branches: [ "master", "main", "develop" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-image:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub (optional - comment out if you use GitHub Packages)
        # Run this with your Docker Hub credentials
        # Using secrets from GitHub Actions secrets
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u $DOCKERHUB_USERNAME --password-stdin
      
      - name: Build Android OS Builder image
        run: |
          docker build -t android-os-builder:${{ github.sha }} .
      
      - name: Push to Docker Hub
        # Run this with your Docker Hub credentials as secrets
        run: |
          docker push registry.gitlab.com/speedyjet/android-os-builder:${{ github.sha }}
          
      - name: Show image details
        run: |
          docker images android-os-builder
