name: Automotive OS Module CI

on:
  push:
    branches: [ "master", "main", "develop" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Gradle Wrapper
        uses: gradle/gradle-build-action@v2.1
        with:
          distribution: 'bin'
          gradle-version: 7.6.4
          wrapper-home: ${{ runner.temp }}

      - name: Run Unit Tests (QA Suite)
        run: ${{ steps.gradle.outputs.wrapper }} testDebugUnitTest --stacktrace

      - name: Run Android Lint
        run: ${{ steps.gradle.outputs.wrapper }} lintDebug

      - name: Assemble Debug APK
        run: ${{ steps.gradle.outputs.wrapper }} assembleDebug

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hu-module-apk
          path: app/build/outputs/apk/debug/*.apk
